<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КАЛЕНДАРЬ С ЗАМЕТКАМИ</title>
    <style>
        :root {
            --bg-main: #ebedf0;
            --month-cell-color: #ebedf0;
            --weekday-cell-color: #ebedf0;
            --day-cell-color: #ffffff;
            --today-cell-color: #2b82fb;
            --other-cell-color: #e6e8ec;
            --weekend-cell-color: #ffe3e3;
            --weekend-font-color: #9b1c1c;
            
            --month-font-size: 24px;
            --month-font-color: #1c2536;
            --month-font-weight: 800;

            --weekday-font-size: 14px;
            --weekday-font-color: #4a5568;
            --weekday-font-weight: 700;

            --day-font-size: 16px;
            --day-font-color: #1a202c;
            --day-font-weight: 700;

            --today-font-size: 16px;
            --today-font-color: #ffffff;
            --today-font-weight: 800;

            --other-day-font-size: 15px;
            --other-day-font-color: #a0aec0;
            --other-day-font-weight: 600;

            /* Переменные для таблицы */
            --table-bg: #ebedf0;
            --table-header-bg: #e1e3e7;
            --table-header-font-size: 12px;
            --table-header-font-color: #2d3748;
            --table-header-font-weight: bold;

            --table-month-cell-bg: #ffffff;
            --table-month-font-size: 12px;
            --table-month-font-color: #1a202c;
            --table-month-font-weight: bold;

            --table-cell-bg: #ffffff;
            --table-cell-font-size: 12px;
            --table-cell-font-color: #1a202c;
            --table-cell-font-weight: normal;

            --table-result-cell-bg: #f0f2f5;
            --table-result-font-size: 12px;
            --table-result-font-color: #2b82fb;
            --table-result-font-weight: bold;

            --table-total-cell-bg: #e1e3e7;
            --table-total-font-size: 12px;
            --table-total-font-color: #e53e3e;
            --table-total-font-weight: bold;

            --table-highlight-row-bg: #fff5f5;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: var(--bg-main); display: flex; flex-direction: column; height: 100vh; padding: 12px; overflow: hidden; }

        /* Верхняя панель */
        .nav-frame {
            background-color: var(--month-cell-color);
            padding: 4px 8px 12px 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 14px;
        }
        .center-nav { display: flex; align-items: center; gap: 12px; flex-grow: 1; justify-content: space-between; }
        
        .header-title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .btn-3d { 
            background: linear-gradient(145deg, #ffffff, #e1e3e7);
            border: none;
            border-radius: 12px;
            width: 42px;
            height: 42px;
            cursor: pointer;
            font-weight: 800;
            font-size: 18px;
            color: #2d3748;
            box-shadow: 4px 4px 8px #d1d3d8, -4px -4px 8px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }
        .btn-3d:active { 
            box-shadow: inset 2px 2px 5px #c2c4c9, inset -2px -2px 5px #ffffff;
            transform: scale(0.96);
        }

        .btn-close { 
            background: linear-gradient(145deg, #ff6b6b, #d32f2f);
            color: white;
            box-shadow: 4px 4px 8px #d1d3d8, -4px -4px 8px #ffffff;
        }
        
        #header-label {
            font-size: var(--month-font-size);
            color: var(--month-font-color);
            font-weight: var(--month-font-weight);
            text-align: center;
            letter-spacing: -0.5px;
        }

        /* Главный блок */
        .main-frame { 
            background: var(--bg-main);
            border-radius: 20px;
            padding: 8px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }
        
        /* Сетка календаря */
        .cal-frame { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        
        .cal-header-cell {
            background: var(--weekday-cell-color);
            color: var(--weekday-font-color);
            font-size: var(--weekday-font-size);
            font-weight: var(--weekday-font-weight);
            text-align: center;
            padding: 10px 0;
            border-radius: 10px;
            box-shadow: 2px 2px 5px #d1d3d8, -2px -2px 5px #ffffff;
        }

        .cal-day-cell {
            background: var(--day-cell-color);
            color: var(--day-font-color);
            font-size: var(--day-font-size);
            font-weight: var(--day-font-weight);
            aspect-ratio: 1.05;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            cursor: pointer;
            position: relative;
            box-shadow: 4px 4px 8px #c8cace, -4px -4px 8px #ffffff;
            transition: all 0.1s ease;
        }

        .cal-day-cell:active {
            box-shadow: inset 2px 2px 5px #b8babe, inset -2px -2px 5px #ffffff;
        }

        .cal-day-cell.weekend {
            background: var(--weekend-cell-color) !important;
            color: var(--weekend-font-color) !important;
        }

        .cal-day-cell.other-month {
            background: var(--other-cell-color);
            color: var(--other-day-font-color);
            font-size: var(--other-day-font-size);
            font-weight: var(--other-day-font-weight);
            box-shadow: 2px 2px 5px #d1d3d8, -2px -2px 5px #ffffff;
        }

        .cal-day-cell.today { 
            background: var(--today-cell-color) !important; 
            color: var(--today-font-color) !important; 
            font-size: var(--today-font-size) !important;
            font-weight: var(--today-font-weight) !important;
            box-shadow: 4px 4px 10px rgba(43, 130, 251, 0.4), -2px -2px 6px #ffffff !important;
        }
        
        /* Стили неоморфной таблицы */
        .table-container {
            background: var(--table-bg);
            padding: 12px;
            border-radius: 18px;
            box-shadow: inset 4px 4px 8px #c8cace, inset -4px -4px 8px #ffffff;
            overflow-x: auto;
        }

        .table-frame { 
            background: transparent; 
            border-collapse: separate; 
            border-spacing: 6px; 
            width: 100%; 
        }
        
        .table-frame th, .table-frame td { 
            border: none; 
            padding: 8px 6px; 
            text-align: center; 
            border-radius: 10px;
        }
        
        .table-frame th { 
            background: var(--table-header-bg); 
            font-size: var(--table-header-font-size); 
            color: var(--table-header-font-color); 
            font-weight: var(--table-header-font-weight); 
            box-shadow: 3px 3px 6px #c8cace, -3px -3px 6px #ffffff;
        }

        .table-month-name {
            background: var(--table-month-cell-bg);
            font-size: var(--table-month-font-size);
            color: var(--table-month-font-color);
            font-weight: var(--table-month-font-weight);
            text-align: left;
            padding-left: 10px;
            box-shadow: 3px 3px 6px #c8cace, -3px -3px 6px #ffffff;
        }

        .table-data-cell {
            background: var(--table-cell-bg);
            box-shadow: inset 2px 2px 4px #c8cace, inset -2px -2px 4px #ffffff;
            padding: 2px;
        }

        .table-result-cell {
            background: var(--table-result-cell-bg);
            font-size: var(--table-result-font-size);
            color: var(--table-result-font-color);
            font-weight: var(--table-result-font-weight);
            box-shadow: 3px 3px 6px #c8cace, -3px -3px 6px #ffffff;
        }

        .table-total-cell {
            background: var(--table-total-cell-bg);
            font-size: var(--table-total-font-size);
            color: var(--table-total-font-color);
            font-weight: var(--table-total-font-weight);
            box-shadow: 3px 3px 6px #c8cace, -3px -3px 6px #ffffff;
        }

        .table-frame input { 
            width: 100%; 
            height: 100%;
            text-align: center; 
            border: none; 
            outline: none;
            border-radius: 8px; 
            font-size: var(--table-cell-font-size); 
            font-weight: var(--table-cell-font-weight);
            color: var(--table-cell-font-color); 
            padding: 6px 2px; 
            background: transparent; 
        }

        .highlight-row td { 
            background-color: var(--table-highlight-row-bg) !important;
            box-shadow: 0 0 0 2px #2b82fb inset, 3px 3px 6px #c8cace !important; 
        }

        /* Нижняя панель */
        .ctrl-frame { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding: 8px 4px 4px 4px; gap: 6px; flex-wrap: wrap; }
        .left-actions { display: flex; gap: 8px; flex-wrap: wrap; }
        
        .action-btn {
            background: linear-gradient(145deg, #ffffff, #e1e3e7);
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            color: #2d3748;
            box-shadow: 4px 4px 8px #d1d3d8, -4px -4px 8px #ffffff;
            transition: all 0.1s ease;
        }
        .action-btn:active {
            box-shadow: inset 2px 2px 5px #c2c4c9, inset -2px -2px 5px #ffffff;
            transform: scale(0.97);
        }

        .gear-btn {
            width: 44px;
            height: 42px;
            background: linear-gradient(145deg, #ffffff, #e1e3e7);
            border: none;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 4px 4px 8px #d1d3d8, -4px -4px 8px #ffffff;
            transition: all 0.1s ease;
        }
        .gear-btn:active {
            box-shadow: inset 2px 2px 5px #c2c4c9, inset -2px -2px 5px #ffffff;
            transform: scale(0.97);
        }

        /* Модальные окна */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { 
            background: #ebedf0; 
            padding: 20px; 
            border-radius: 20px; 
            width: 92%; 
            max-width: 480px; 
            max-height: 90vh; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            box-shadow: 10px 10px 30px rgba(0,0,0,0.25), -6px -6px 20px #ffffff; 
            border: 1px solid rgba(255,255,255,0.6);
        }

        .modal-item-card {
            background: #ebedf0;
            padding: 10px;
            border-radius: 12px;
            box-shadow: 3px 3px 6px #c8cace, -3px -3px 6px #ffffff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-input {
            border: none;
            outline: none;
            background: #f0f2f5;
            padding: 6px 10px;
            border-radius: 8px;
            box-shadow: inset 2px 2px 4px #c8cace, inset -2px -2px 4px #ffffff;
            font-size: 12px;
        }
        
        /* Полноэкранное окно таблицы */
        .fullscreen-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #ebedf0; z-index: 2000; flex-direction: column; padding: 12px; overflow: hidden; }
        .fullscreen-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            background: #ebedf0; 
            padding: 10px 14px; 
            border-radius: 16px; 
            box-shadow: 5px 5px 10px #d1d3d8, -5px -5px 10px #ffffff; 
        }
        .fullscreen-body { flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

        .palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 8px; }
        .color-btn { width: 100%; aspect-ratio: 1.4; border-radius: 8px; border: none; cursor: pointer; box-shadow: 3px 3px 6px rgba(0,0,0,0.15), -2px -2px 4px #ffffff; }
        .color-btn.selected { border: 2px solid #2d3748; transform: scale(1.08); }
        
        textarea { width: 100%; height: 95px; padding: 10px; font-size: 13px; border: none; border-radius: 12px; background: #f0f2f5; box-shadow: inset 3px 3px 6px #c8cace, inset -3px -3px 6px #ffffff; resize: none; outline: none; }
    </style>
</head>
<body>

    <div class="nav-frame" id="nav-frame">
        <div class="center-nav">
            <button class="btn-3d" onclick="prevMonth()">&lt;</button>
            <div class="header-title-block">
                <div id="header-label">Март 2025</div>
            </div>
            <button class="btn-3d" onclick="nextMonth()">&gt;</button>
        </div>
        <button class="btn-3d btn-close" onclick="closeApp()" style="margin-left: 10px;">✕</button>
    </div>

    <div class="main-frame">
        <div class="cal-frame" id="cal-frame"></div>
    </div>

    <div class="ctrl-frame">
        <div class="left-actions">
            <button class="action-btn" onclick="openTableModal()" style="background: linear-gradient(145deg, #e0f7fa, #b2ebf2); color:#006064;">ТАБЛИЦА</button>
            <button class="action-btn" onclick="exportData()">ЭКСПОРТ</button>
            <button class="action-btn" onclick="importDataTrigger()">ИМПОРТ</button>
            <button class="action-btn" style="background: linear-gradient(145deg, #ffebee, #ffcdd2); color:#b71c1c;" onclick="clearMonth()">ОЧИСТИТЬ</button>
            <input type="file" id="import-file" style="display:none" onchange="importData(event)">
        </div>
        <div class="gear-btn" onclick="openSettings()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#4a5568">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </div>
    </div>

    <!-- Полноэкранное окно таблицы -->
    <div class="fullscreen-modal" id="table-modal">
        <div class="fullscreen-header">
            <div style="display:flex; gap:8px;">
                <button class="action-btn" style="background: linear-gradient(145deg, #a5d6a7, #66bb6a); color:white;" onclick="saveTableChanges()">СОХРАНИТЬ</button>
                <button class="action-btn" style="background: linear-gradient(145deg, #ef9a9a, #ef5350); color:white;" onclick="closeTableModal()">ОТМЕНИТЬ</button>
            </div>
            <div style="font-weight:800; font-size:15px; color:#2d3748;" id="table-modal-year-title">ГОД</div>
            <button class="action-btn" onclick="openTableSettings()">НАСТРОЙКИ</button>
        </div>
        <div class="fullscreen-body">
            <div class="table-container" id="table-container-box">
                <table class="table-frame" id="stats-table">
                    <thead>
                        <tr>
                            <th>МЕСЯЦ</th><th>С -</th><th>- ПО</th><th>С -</th><th>- ПО</th><th>ДНЕЙ</th>
                        </tr>
                    </thead>
                    <tbody id="table-body"></tbody>
                    <tfoot>
                        <tr>
                            <td class="table-total-cell" style="text-align:left; padding-left:10px;">ГОД:</td>
                            <td colspan="5" id="total-year-days" class="table-total-cell" style="text-align:center;">0</td>
                        </tr>
                        <tr>
                            <td class="table-total-cell" style="text-align:left; padding-left:10px; color:#2b82fb;">ВСЕ ВРЕМЯ:</td>
                            <td colspan="5" id="total-all-days" class="table-total-cell" style="text-align:center; color:#2b82fb;">0</td>
                        </tr>
                    </tfoot>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно заметки -->
    <div class="modal" id="note-modal">
        <div class="modal-content">
            <h3 id="modal-date-title" style="font-size: 15px; color: #1c2536; font-weight:800;">Заметка</h3>
            <div>
                <label style="font-size: 11px; font-weight: bold; color: #4a5568;">ЦВЕТ ТОЧКИ:</label>
                <div class="palette" id="color-palette" style="margin-top:6px;"></div>
            </div>
            <textarea id="note-text" placeholder="Введите заметку..."></textarea>
            <button class="action-btn" style="background: linear-gradient(145deg, #a5d6a7, #66bb6a); color:white; height:40px;" onclick="saveNote()">СОХРАНИТЬ</button>
            <button class="action-btn" onclick="closeNoteModal()">ОТМЕНА</button>
        </div>
    </div>

    <!-- Модальное окно экспорта (гарантированное сохранение для APK) -->
    <div class="modal" id="export-modal">
        <div class="modal-content">
            <h3 style="color:#1c2536; font-weight:800;">ЭКСПОРТ ДАННЫХ</h3>
            <div style="font-size: 11px; color: #718096;">Нажмите кнопку «СКАЧАТЬ ФАЙЛ» или скопируйте текст ниже:</div>
            <textarea id="export-text-area" readonly style="height: 120px;"></textarea>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" style="background: linear-gradient(145deg, #a5d6a7, #66bb6a); color:white; flex-grow:1; height:40px;" onclick="downloadBackupFile()">СКАЧАТЬ ФАЙЛ</button>
                <button class="action-btn" style="background: linear-gradient(145deg, #e0f7fa, #b2ebf2); color:#006064; flex-grow:1; height:40px;" onclick="copyExportText()">СКОПИРОВАТЬ</button>
            </div>
            <button class="action-btn" onclick="closeExportModal()">ЗАКРЫТЬ</button>
        </div>
    </div>

    <!-- Модальное окно настроек календаря -->
    <div class="modal" id="settings-modal">
        <div class="modal-content" style="max-width: 480px;">
            <h3 style="color:#1c2536; font-weight:800;">НАСТРОЙКИ КАЛЕНДАРЯ</h3>
            <div style="font-size: 11px; color: #718096;">Настройте внешний вид под себя:</div>
            <div style="display:flex; flex-direction:column; gap:8px;" id="settings-controls"></div>
            <button class="action-btn" style="background: linear-gradient(145deg, #a5d6a7, #66bb6a); color:white; height:40px;" onclick="saveSettings()">СОХРАНИТЬ</button>
            <button class="action-btn" style="background: linear-gradient(145deg, #ef9a9a, #ef5350); color:white;" onclick="closeSettings()">ОТМЕНИТЬ</button>
        </div>
    </div>

    <!-- Модальное окно настроек таблицы -->
    <div class="modal" id="table-settings-modal">
        <div class="modal-content" style="max-width: 480px;">
            <h3 style="color:#1c2536; font-weight:800;">НАСТРОЙКИ ТАБЛИЦЫ</h3>
            <div style="font-size: 11px; color: #718096;">Настройте внешний вид элементов таблицы:</div>
            <div style="display:flex; flex-direction:column; gap:8px;" id="table-settings-controls"></div>
            <button class="action-btn" style="background: linear-gradient(145deg, #a5d6a7, #66bb6a); color:white; height:40px;" onclick="saveTableSettings()">СОХРАНИТЬ</button>
            <button class="action-btn" style="background: linear-gradient(145deg, #ef9a9a, #ef5350); color:white;" onclick="closeTableSettings()">ОТМЕНИТЬ</button>
        </div>
    </div>

    <script>
        const DISPLAY_MONTHS = ["ЯНВАРЬ", "ФЕВРАЛЬ", "МАРТ", "АПРЕЛЬ", "МАЙ", "ИЮНЬ", "ИЮЛЬ", "АВГУСТ", "СЕНТЯБРЬ", "ОКТЯБРЬ", "НОЯБРЬ", "ДЕКАБРЬ"];
        const DOT_COLORS = ["#00E676", "#29B6F6", "#EF5350", "#FFEE58", "#AB47BC", "#FFA726", "#26A69A", "#EC407A", "#8D6E63", "#78909C", "#FF7043", "#66BB6A", "#42A5F5", "#E57373", "#FFF176", "#BA68C8", "#FFB74D", "#4DB6AC", "#F06292", "#A1887F", "#90A4AE", "#FF8A65"];
        
        let currentDate = new Date();
        let year = currentDate.getFullYear();
        let month = currentDate.getMonth() + 1;
        let selectedDateStr = "";
        let selectedColor = DOT_COLORS[0];

        let db = JSON.parse(localStorage.getItem('calendar_db')) || { notes: {}, table_ranges: {} };
        let tempDbRanges = JSON.parse(JSON.stringify(db.table_ranges));
        
        let savedSettings = JSON.parse(localStorage.getItem('calendar_settings'));
        let settings = savedSettings && typeof savedSettings === 'object' ? {
            bg_main: savedSettings.bg_main || "#ebedf0",
            month_font_size: Number(savedSettings.month_font_size) || 24,
            month_font_color: savedSettings.month_font_color || "#1c2536",
            month_font_weight: Boolean(savedSettings.month_font_weight),
            
            weekday_font_size: Number(savedSettings.weekday_font_size) || 14,
            weekday_font_color: savedSettings.weekday_font_color || "#4a5568",

        function renderCalendar() {
            applySettings();
            document.getElementById('header-label').innerText = `${DISPLAY_MONTHS[month-1]} ${year}`;
            let calFrame = document.getElementById('cal-frame');
            calFrame.innerHTML = '';

            let daysOfWeek = ["Пн", "Вт", "Ср", "Чт", "Пт", "Сб", "Вс"];
            daysOfWeek.forEach((d) => {
                let div = document.createElement('div');
                div.className = 'cal-header-cell';
                div.innerText = d;
                calFrame.appendChild(div);
            });

            let firstDayIndex = (new Date(year, month - 1, 1).getDay() + 6) % 7;
            let totalDays = new Date(year, month, 0).getDate();
            let prevTotalDays = new Date(year, month - 1, 0).getDate();
            let now = new Date();

            for (let i = firstDayIndex - 1; i >= 0; i--) {
                let d = prevTotalDays - i;
                let prevM = month === 1 ? 12 : month - 1;
                let prevY = month === 1 ? year - 1 : year;
                let colIdx = (firstDayIndex - 1 - i) % 7;
                createDayCell(calFrame, d, prevY, prevM, true, false, colIdx >= 5);
            }

            for (let d = 1; d <= totalDays; d++) {
                let colIdx = (firstDayIndex + d - 1) % 7;
                let isToday = (d === now.getDate() && month === now.getMonth() + 1 && year === now.getFullYear());
                createDayCell(calFrame, d, year, month, false, isToday, colIdx >= 5);
            }

            let remainingCells = 42 - (firstDayIndex + totalDays);
            for (let d = 1; d <= remainingCells; d++) {
                let nextM = month === 12 ? 1 : month + 1;
                let nextY = month === 12 ? year + 1 : year;
                let colIdx = (firstDayIndex + totalDays + d - 1) % 7;
                createDayCell(calFrame, d, nextY, nextM, true, false, colIdx >= 5);
            }
        }

        function createDayCell(parent, day, y, m, isOther, isToday = false, isWeekend = false) {
            let cell = document.createElement('div');
            let classes = ['cal-day-cell'];
            if (isOther) classes.push('other-month');
            else if (isToday) classes.push('today');
            else if (isWeekend) classes.push('weekend');
            
            cell.className = classes.join(' ');
            
            let dateStr = `${y}-${String(m).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            let noteInfo = db.notes[dateStr];
            let hasNote = false;
            let noteText = "";
            let dotColor = "#00E676";

            if (noteInfo) {
                if (typeof noteInfo === 'object') {
                    noteText = noteInfo.text || "";
                    dotColor = noteInfo.color || "#00E676";
                    if (noteText.trim() !== "") hasNote = true;
                } else if (typeof noteInfo === 'string' && noteInfo.trim() !== "") {
                    hasNote = true;
                    noteText = noteInfo.trim();
                }
            }

            if (settings.note_display_mode === "Текст заметки" && hasNote && !isOther) {
                cell.innerHTML = `
                    <div>${day}</div>
                    <div style="font-size:${settings.note_font_size}px; font-weight:bold; color:${dotColor}; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; width:95%;">${noteText}</div>
                `;
            } else {
                cell.innerText = day;
                if (hasNote && settings.note_display_mode === "Цветные точки") {
                    let canvas = document.createElement('canvas');
                    let sz = settings.dot_size + 4;
                    canvas.width = sz;
                    canvas.height = sz;
                    canvas.style.position = 'absolute';
                    canvas.style.bottom = '3px';
                    canvas.style.left = '50%';
                    canvas.style.transform = 'translateX(-50%)';
                    
                    let ctx = canvas.getContext('2d');
                    let r = settings.dot_size / 2;
                    let cx = sz / 2, cy = sz / 2;
                    
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.fillStyle = dotColor;
                    ctx.fill();
                    if (settings.dot_relief_sunken > 0) {
                        ctx.lineWidth = settings.dot_relief_sunken;
                        ctx.strokeStyle = "rgba(0,0,0,0.2)";
                        ctx.stroke();
                    }
                    if (settings.dot_3d_style === "Сфера с бликом" && settings.dot_relief_raised > 0) {
                        ctx.beginPath();
                        ctx.arc(cx - r/3, cy - r/3, r/3, 0, 2 * Math.PI);
                        ctx.fillStyle = "#ffffff";
                        ctx.fill();
                    }
                    cell.appendChild(canvas);
                }
            }

            cell.onclick = () => openNoteModal(dateStr);
            parent.appendChild(cell);
        }

        function collectTableInputsToTemp() {
            let yearStr = year.toString();
            if (!tempDbRanges[yearStr]) tempDbRanges[yearStr] = {};

            for (let i = 1; i <= 12; i++) {
                let f1 = document.getElementById(`f1_${i}`).value.trim();
                let t1 = document.getElementById(`t1_${i}`).value.trim();
                let f2 = document.getElementById(`f2_${i}`).value.trim();
                let t2 = document.getElementById(`t2_${i}`).value.trim();

                if (f1 || t1 || f2 || t2) {
                    tempDbRanges[yearStr][i] = { from1: f1, to1: t1, from2: f2, to2: t2 };
                } else {
                    delete tempDbRanges[yearStr][i];
                }
            }
        }

        function updateTableCalculations() {
            let yearStr = year.toString();
            let yearData = tempDbRanges[yearStr] || {};
            let totalYear = 0;

            for (let i = 1; i <= 12; i++) {
                let mData = yearData[i] || {};
                let monthSum = calcMonthDays(i, mData.from1, mData.to1, mData.from2, mData.to2);
                document.getElementById(`res_${i}`).innerText = monthSum > 0 ? monthSum : '';
                totalYear += monthSum;
            }

            document.getElementById('total-year-days').innerText = totalYear;
            calcAllTimeFromTemp();
        }

        function calcMonthDays(m, f1, t1, f2, t2) {
            let sum = 0;
            if (f1 && t1) {
                let d1 = new Date(year, m - 1, parseInt(f1));
                let d2 = new Date(year, m - 1, parseInt(t1));
                if (d1 <= d2) sum += Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            }
            if (f2 && t2) {
                let d3 = new Date(year, m - 1, parseInt(f2));
                let d4 = new Date(year, m - 1, parseInt(t2));
                if (d3 <= d4) sum += Math.round((d4 - d3) / (1000 * 60 * 60 * 24)) + 1;
            }
            return sum;
        }

        function loadTableData() {
            let yearStr = year.toString();
            let yearData = tempDbRanges[yearStr] || {};
            for (let i = 1; i <= 12; i++) {
                let mData = yearData[i] || {};
                document.getElementById(`f1_${i}`).value = mData.from1 || '';
                document.getElementById(`t1_${i}`).value = mData.t1 || '';
                document.getElementById(`f2_${i}`).value = mData.from2 || '';
                document.getElementById(`t2_${i}`).value = mData.t2 || '';
            }
            updateTableCalculations();
        }

        function calcAllTime() {
            let allTime = 0;
            for (let yStr in db.table_ranges) {
                let yVal = parseInt(yStr);
                for (let mStr in db.table_ranges[yStr]) {
                    let mVal = parseInt(mStr);
                    let r = db.table_ranges[yStr][mStr];
                    allTime += calcMonthDaysForYear(yVal, mVal, r.from1, r.to1, r.from2, r.to2);
                }
            }
            document.getElementById('total-all-days').innerText = allTime;
        }

        function calcAllTimeFromTemp() {
            let allTime = 0;
            for (let yStr in tempDbRanges) {
                let yVal = parseInt(yStr);
                for (let mStr in tempDbRanges[yStr]) {
                    let mVal = parseInt(mStr);
                    let r = tempDbRanges[yStr][mStr];
                    allTime += calcMonthDaysForYear(yVal, mVal, r.from1, r.to1, r.from2, r.to2);
                }
            }
            document.getElementById('total-all-days').innerText = allTime;
        }

        function calcMonthDaysForYear(y, m, f1, t1, f2, t2) {
            let sum = 0;
            if (f1 && t1) {
                let d1 = new Date(y, m - 1, parseInt(f1));
                let d2 = new Date(y, m - 1, parseInt(t1));
                if (d1 <= d2) sum += Math.round((d2 - d1) / (1000 * 60 * 60 * 24)) + 1;
            }
            if (f2 && t2) {
                let d3 = new Date(y, m - 1, parseInt(f2));
                let d4 = new Date(y, m - 1, parseInt(t2));
                if (d3 <= d4) sum += Math.round((d4 - d3) / (1000 * 60 * 60 * 24)) + 1;
            }
            return sum;
        }

        function highlightActiveTableRow() {
            for (let i = 1; i <= 12; i++) {
                let row = document.getElementById(`row-month-${i}`);
                if (i === month) row.classList.add('highlight-row');
                else row.classList.remove('highlight-row');
            }

        function clearMonth() {
            if (!confirm(`Удалить все заметки за ${DISPLAY_MONTHS[month-1]} ${year}?`)) return;
            let prefix = `${year}-${String(month).padStart(2, '0')}-`;
            for (let k in db.notes) {
                if (k.startsWith(prefix)) delete db.notes[k];
            }
            localStorage.setItem('calendar_db', JSON.stringify(db));
            renderCalendar();
        }

        function importDataTrigger() { document.getElementById('import-file').click(); }
        function importData(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(event) {
                try {
                    let imported = JSON.parse(event.target.result);
                    db = imported;
                    localStorage.setItem('calendar_db', JSON.stringify(db));
                    renderCalendar();
                    calcAllTime();
                    alert("Данные успешно импортированы!");
                } catch(err) { alert("Ошибка чтения файла!"); }
            };
            reader.readAsText(file);
        }

        function openSettings() {
            let container = document.getElementById('settings-controls');
            container.innerHTML = '';
            
            let items = [
                { label: "Общий фон приложения", cell: "bg_main" },
                { label: "Шрифт месяца", sz: "month_font_size", col: "month_font_color", b: "month_font_weight", cell: "month_cell_color" },
                { label: "Шрифт дней недели", sz: "weekday_font_size", col: "weekday_font_color", b: "weekday_font_weight", cell: "weekday_cell_color" },
                { label: "Шрифт чисел календаря", sz: "day_font_size", col: "day_font_color", b: "day_font_weight", cell: "day_cell_color" },
                { label: "Шрифт текущего дня", sz: "today_font_size", col: "today_font_color", b: "today_font_weight", cell: "today_cell_color" },
                { label: "Шрифт чужих дней", sz: "other_day_font_size", col: "other_day_font_color", b: "other_day_font_weight", cell: "other_cell_color" },
                { label: "Выходные дни (суббота/воскресенье)", col: "weekend_font_color", cell: "weekend_cell_color" }
            ];

            items.forEach(item => {
                let div = document.createElement('div');
                div.className = "modal-item-card";
                div.innerHTML = `<b style="font-size:11px; color:#2d3748;">${item.label}</b>`;
                
                if (item.sz) {
                    div.innerHTML += `
                        <div style="display:flex; gap:6px; align-items:center; font-size:11px; flex-wrap:wrap;">
                            Размер: <input type="number" class="modal-input" id="st_${item.sz}" value="${settings[item.sz]}" style="width:45px;">
                            Жирный: <input type="checkbox" id="st_${item.b}" ${settings[item.b] ? 'checked' : ''}>
                            Цвет: <input type="text" class="modal-input" id="st_${item.col}" value="${settings[item.col]}" style="width:65px;">
                            Фон: <input type="text" class="modal-input" id="st_${item.cell}" value="${settings[item.cell]}" style="width:65px;">
                        </div>
                    `;
                } else if (item.col && item.cell) {
                    div.innerHTML += `
                        <div style="display:flex; gap:6px; align-items:center; font-size:11px; flex-wrap:wrap;">
                            Цвет текста: <input type="text" class="modal-input" id="st_${item.col}" value="${settings[item.col]}" style="width:75px;">
                            Цвет фона: <input type="text" class="modal-input" id="st_${item.cell}" value="${settings[item.cell]}" style="width:75px;">
                        </div>
                    `;
                } else {
                    div.innerHTML += `<div style="font-size:11px;">HEX цвет: <input type="text" class="modal-input" id="st_${item.cell}" value="${settings[item.cell]}" style="width:85px;"></div>`;
                }
                container.appendChild(div);
            });

            let dotDiv = document.createElement('div');
            dotDiv.className = "modal-item-card";
            dotDiv.innerHTML = `
                <b style="font-size:11px; color:#2d3748;">Параметры заметок на календаре</b>
                <div style="display:flex; flex-direction:column; gap:6px; font-size:11px; margin-top:4px;">
                    <div>Режим: <select class="modal-input" id="st_note_display_mode"><option ${settings.note_display_mode==="Цветные точки"?"selected":""}>Цветные точки</option><option ${settings.note_display_mode==="Текст заметки"?"selected":""}>Текст заметки</option></select></div>
                    <div>Размер точки: <input type="number" class="modal-input" id="st_dot_size" value="${settings.dot_size}" style="width:50px;"></div>
                    <div>Шрифт текста: <input type="number" class="modal-input" id="st_note_font_size" value="${settings.note_font_size}" style="width:50px;"></div>
                </div>
            `;
            container.appendChild(dotDiv);

            document.getElementById('settings-modal').style.display = 'flex';
        }

        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function saveSettings() {
            let keys = [
                "bg_main",
                "month_font_size", "month_font_color", "month_font_weight", "month_cell_color",
                "weekday_font_size", "weekday_font_color", "weekday_font_weight", "weekday_cell_color",
                "day_font_size", "day_font_color", "day_font_weight", "day_cell_color",
                "today_font_size", "today_font_color", "today_font_weight", "today_cell_color",
                "other_day_font_size", "other_day_font_color", "other_day_font_weight", "other_cell_color",
                "weekend_cell_color", "weekend_font_color",
                "dot_size", "note_font_size"
            ];

            keys.forEach(key => {
                let el = document.getElementById(`st_${key}`);
                if (el) {
                    if (key.includes('weight')) settings[key] = el.checked;
                    else if (key.includes('size')) settings[key] = parseInt(el.value) || 12;
                    else settings[key] = el.value;
                }
            });

            let modeEl = document.getElementById('st_note_display_mode');
            if (modeEl) settings.note_display_mode = modeEl.value;

            localStorage.setItem('calendar_settings', JSON.stringify(settings));
            closeSettings();
            renderCalendar();
        }

        /* Настройки таблицы */
        function openTableSettings() {
            let container = document.getElementById('table-settings-controls');
            container.innerHTML = '';
            
            let items = [
                { label: "Фон контейнера таблицы", cell: "table_bg" },
                { label: "Шапка таблицы (заголовки)", sz: "table_header_font_size", col: "table_header_font_color", b: "table_header_font_weight", cell: "table_header_bg" },
                { label: "Ячейки месяцев (левый столбец)", sz: "table_month_font_size", col: "table_month_font_color", b: "table_month_font_weight", cell: "table_month_cell_bg" },
                { label: "Ячейки диапазона дат (ввод)", sz: "table_cell_font_size", col: "table_cell_font_color", b: "table_cell_font_weight", cell: "table_cell_bg" },
                { label: "Ячейки результатов (ДНЕЙ)", sz: "table_result_font_size", col: "table_result_font_color", b: "table_result_font_weight", cell: "table_result_cell_bg" },
                { label: "Итоговые строки (ГОД / ВСЕ ВРЕМЯ)", sz: "table_total_font_size", col: "table_total_font_color", b: "table_total_font_weight", cell: "table_total_cell_bg" },
                { label: "Цвет подсветки текущей строки месяца", cell: "table_highlight_row_bg" }
            ];

            items.forEach(item => {
                let div = document.createElement('div');
                div.className = "modal-item-card";
                div.innerHTML = `<b style="font-size:11px; color:#2d3748;">${item.label}</b>`;
                
                if (item.sz) {
                    div.innerHTML += `
                        <div style="display:flex; gap:6px; align-items:center; font-size:11px; flex-wrap:wrap;">
                            Размер: <input type="number" class="modal-input" id="tst_${item.sz}" value="${tableSettings[item.sz]}" style="width:45px;">
                            Жирный: <input type="checkbox" id="tst_${item.b}" ${tableSettings[item.b] ? 'checked' : ''}>
                            Цвет: <input type="text" class="modal-input" id="tst_${item.col}" value="${tableSettings[item.col]}" style="width:65px;">
                            Фон: <input type="text" class="modal-input" id="tst_${item.cell}" value="${tableSettings[item.cell]}" style="width:65px;">
                        </div>
                    `;
                } else {
                    div.innerHTML += `<div style="font-size:11px;">HEX цвет: <input type="text" class="modal-input" id="tst_${item.cell}" value="${tableSettings[item.cell]}" style="width:85px;"></div>`;
                }
                container.appendChild(div);
            });

            document.getElementById('table-settings-modal').style.display = 'flex';
        }

        function closeTableSettings() { document.getElementById('table-settings-modal').style.display = 'none'; }

        function saveTableSettings() {
            let keys = [
                "table_bg", "table_header_bg", "table_header_font_size", "table_header_font_color", "table_header_font_weight",
                "table_month_cell_bg", "table_month_font_size", "table_month_font_color", "table_month_font_weight",
                "table_cell_bg", "table_cell_font_size", "table_cell_font_color", "table_cell_font_weight",
                "table_result_cell_bg", "table_result_font_size", "table_result_font_color", "table_result_font_weight",
                "table_total_cell_bg", "table_total_font_size", "table_total_font_color", "table_total_font_weight",
                "table_highlight_row_bg"
            ];

            keys.forEach(key => {
                let el = document.getElementById(`tst_${key}`);
                if (el) {
                    if (key.includes('weight')) tableSettings[key] = el.checked;
                    else if (key.includes('size')) tableSettings[key] = parseInt(el.value) || 11;
                    else tableSettings[key] = el.value;
                }
            });

            localStorage.setItem('table_settings', JSON.stringify(tableSettings));
            closeTableSettings();
            applySettings();
        }

        initTable();
        renderCalendar();
        calcAllTime();
    </script>
</body>
</html>
