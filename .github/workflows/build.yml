name: Build Android APK

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Cordova globally
        run: npm install -g cordova

      - name: Create Cordova project and configure splash
        run: |
          cordova create my-app com.dejurstvo.app Dejurstvo
          cd my-app
          cordova platform add android
          cp ../index.html www/index.html
          
          # Установка иконки приложения
          if [ -f "../icon.png" ]; then
            mkdir -p platforms/android/app/src/main/res/mipmap-xxhdpi/
            cp ../icon.png platforms/android/app/src/main/res/mipmap-xxhdpi/icon.png
            cp ../icon.png platforms/android/app/src/main/res/drawable/icon.png
            sed -i '/<\/widget>/i \    <icon src="../icon.png" />' config.xml
          fi

          # Принудительная замена заставки (Splash Screen) во всех плотностях Android
          if [ -f "../splash.png" ]; then
            # Создаем папки для всех разрешений экрана Android и раскидываем вашу картинку
            for dir in drawable-port-ldpi drawable-port-mdpi drawable-port-hdpi drawable-port-xhdpi drawable-port-xxhdpi drawable-port-xxxhdpi drawable; do
              mkdir -p platforms/android/app/src/main/res/$dir/
              cp ../splash.png platforms/android/app/src/main/res/$dir/screen.png
              cp ../splash.png platforms/android/app/src/main/res/$dir/splash.png
            done

            # Прописываем параметры заставки в config.xml
            sed -i '/<\/widget>/i \    <preference name="SplashScreen" value="screen" />' config.xml
            sed -i '/<\/widget>/i \    <preference name="SplashScreenDelay" value="3000" />' config.xml
            sed -i '/<\/widget>/i \    <preference name="AutoHideSplashScreen" value="true" />' config.xml
            sed -i '/<\/widget>/i \    <preference name="FadeSplashScreen" value="true" />' config.xml
            sed -i '/<\/widget>/i \    <preference name="FadeSplashScreenDuration" value="500" />' config.xml
          fi

          cordova build android

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dejurstvo-apk
          path: my-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
